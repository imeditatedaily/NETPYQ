# Separate light and dark sections keep Streamlit following the viewer's
# system setting (a plain [theme] section would force light mode).
[theme.light]
primaryColor = "#256abf"

[theme.dark]
primaryColor = "#3987e5"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[secrets]
# The usual places, plus Render's Secret Files folder.
files = ["~/.streamlit/secrets.toml", ".streamlit/secrets.toml", "/etc/secrets/secrets.toml"]
